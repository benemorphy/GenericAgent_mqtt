<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="utf-8"><title>TITLE_HERE</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PptxGenJS/3.12.0/pptxgen.bundle.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Microsoft YaHei','PingFang SC',sans-serif}
body{background:linear-gradient(135deg,#0f0f1a 0%,#1a1a2e 30%,#16213e 70%,#0f3460 100%);color:#fff;overflow-x:hidden}
.slide{min-height:100vh;display:flex;flex-direction:column;padding:50px 70px;position:relative;page-break-after:always}
.slide:after{content:counter(slide);counter-increment:slide;position:absolute;bottom:25px;right:50px;font-size:14px;color:#445;font-weight:bold}
body{counter-reset:slide}
.hero{text-align:center;margin:auto;max-width:900px;width:100%}
.hero h1{font-size:48px;font-weight:700;line-height:1.3;background:linear-gradient(90deg,COLOR1_HERE,COLOR2_HERE,#e2a8ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:14px}
.hero .sub{font-size:18px;color:#8899bb;line-height:1.6;margin-bottom:20px}
.hero .tag{display:inline-block;padding:8px 24px;border-radius:20px;background:rgba(COLOR1_RGB,0.2);border:1px solid rgba(COLOR1_RGB,0.3);color:COLOR1_HERE;font-size:14px;margin-bottom:25px}
.m-row{display:flex;justify-content:center;gap:20px;flex-wrap:wrap}
.m-card{background:rgba(255,255,255,0.05);border-radius:16px;padding:24px 28px;text-align:center;min-width:150px;border:1px solid rgba(255,255,255,0.06)}
.m-card .mv{font-size:36px;font-weight:800;background:linear-gradient(135deg,COLOR1_HERE,COLOR2_HERE);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.m-card .ml{font-size:13px;color:#8899bb;margin-top:6px}
.s-header{border-bottom:1px solid rgba(255,255,255,0.08);padding-bottom:20px;margin-bottom:25px}
.s-header h2{font-size:28px;font-weight:600;color:COLOR1_HERE}
.s-body{flex:1;overflow-y:auto}
.kp{font-size:15px;color:#8899bb;margin-bottom:20px;line-height:1.6}
.card-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{background:rgba(255,255,255,0.04);border-radius:12px;padding:20px;border-top:3px solid COLOR3_HERE}
.card h3{font-size:16px;font-weight:600;margin-bottom:10px;color:#fff}
.card li{font-size:13px;color:#ccc;padding:3px 0 3px 16px;list-style:none;position:relative}
.card li:before{content:'•';color:COLOR2_HERE;position:absolute;left:0}
.chart-box{width:100%;height:100%;min-height:400px}
@media print{.slide{page-break-after:always;min-height:100vh}}
</style></head><body>SLIDES_HERE<script>CHARTS_JS_HERE</script></body></html>
