{% extends "layout.html" %}
{% block title %}{{ room.name }} - Playground{% endblock %}
{% block nav_active %}play{% endblock %}
{% block content %}
<a href="/play" class="back-link" style="margin-bottom:8px;display:inline-block;">&larr; 返回地图</a>

<div class="room-header" style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
    <span style="font-size:48px;">{{ room.icon }}</span>
    <div>
        <h2 style="margin:0;">{{ room.name }}</h2>
        <p style="color:#888;margin:0;">{{ room.desc }}</p>
        <p style="font-size:12px;color:#999;margin:4px 0 0;">📡 {{ room.topic }}</p>
    </div>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
    <!-- MQTT Console -->
    <div class="card" style="grid-column:1/-1;">
        <h3>📻 MQTT Console</h3>
        <div id="console" style="background:#1a1a2e;color:#00ff88;font-family:monospace;padding:12px;border-radius:6px;height:200px;overflow-y:auto;font-size:13px;">
            <div>> 连接就绪</div>
        </div>
        <div style="display:flex;gap:8px;margin-top:8px;">
            <input id="topic" placeholder="topic" value="{{ room.topic }}" style="flex:2;padding:6px;border:1px solid #ddd;border-radius:4px;">
            <input id="payload" placeholder="payload (JSON)" style="flex:3;padding:6px;border:1px solid #ddd;border-radius:4px;">
            <button onclick="publish()" style="padding:6px 16px;">发布</button>
            <button onclick="subscribe()" style="padding:6px 16px;">订阅</button>
        </div>
    </div>
</div>

<script>
var ws = null;
function connectWS() {
    ws = new WebSocket('ws://' + location.host + '/play/api/ws?topic=' + encodeURIComponent('{{ room.topic }}'));
    ws.onmessage = function(e) {
        var msg = JSON.parse(e.data);
        var console = document.getElementById('console');
        var line = document.createElement('div');
        line.textContent = '[' + msg.topic + '] ' + JSON.stringify(msg.payload);
        console.appendChild(line);
        console.scrollTop = console.scrollHeight;
    };
    ws.onclose = function() { setTimeout(connectWS, 3000); };
}
function publish() {
    var topic = document.getElementById('topic').value;
    var payload = document.getElementById('payload').value;
    fetch('/play/api/post', {method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({topic:topic, payload:payload})})
    .then(r=>r.json()).then(d=>{
        if(d.ok) document.getElementById('console').innerHTML += '<div style="color:#888;">> 已发布到 ' + topic + '</div>';
    });
}
function subscribe() {
    var topic = document.getElementById('topic').value;
    connectWS();
}
connectWS();
</script>
{% endblock %}
