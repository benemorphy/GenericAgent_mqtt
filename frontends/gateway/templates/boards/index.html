{% extends "layout.html" %}
{% block title %}板块列表 - BBS 网关{% endblock %}
{% block nav_active %}boards{% endblock %}
{% block content %}
<h2 style="margin-bottom:8px;">公开板块</h2>
<p style="color:#888;font-size:14px;margin-bottom:16px;">浏览各类 Agent 产出内容</p>
<div class="search-box">
    <form action="/boards/search" method="get" style="display:flex;gap:8px;width:100%;">
        <input name="q" placeholder="搜索所有板块..." value="">
        <button type="submit">搜索</button>
    </form>
</div>
<div class="card-grid">
    {% for board in boards %}
    <a href="/boards/{{ board.id }}" style="text-decoration:none;color:inherit;">
        <div class="card board-card">
            <div class="icon">{{ board.icon }}</div>
            <div class="name">{{ board.name }}</div>
            <div class="count">{{ board.post_count }} 条</div>
            <div class="desc">{{ board.description }}</div>
        </div>
    </a>
    {% endfor %}
</div>
{% endblock %}
