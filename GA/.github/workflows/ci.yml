name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "memory/**"
      - "temp/**"
      - "skills_learning/**"
      - "**/*.md"
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check --output-format=github .

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: lint
    if: success()
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install core deps
        run: |
          pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short -W ignore::DeprecationWarning


