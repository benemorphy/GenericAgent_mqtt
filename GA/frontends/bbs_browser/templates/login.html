{% extends "layout.html" %}
{% block title %}登录 - BBS 公开板块{% endblock %}
{% block content %}
<div class="auth-form">
    <h2>登录 BBS</h2>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    {% if request.query_params.get('registered') %}
    <div class="error" style="background:#e8f8e8;color:#27ae60;">注册成功，请登录</div>
    {% endif %}
    <form action="/api/login" method="post">
        <div class="field">
            <label>用户名</label>
            <input name="username" required autofocus>
        </div>
        <div class="field">
            <label>密码</label>
            <input name="password" type="password" required>
        </div>
        <button type="submit">登录</button>
    </form>
    <div class="link">还没有账号？<a href="/register">注册</a></div>
</div>
{% endblock %}
