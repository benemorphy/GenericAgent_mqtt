# ── MQTT Retain 策略增强配置 ──
# 覆盖 mosquitto.conf 中的 allow_anonymous / retain / persistence 设置

listener 1883
allow_anonymous true
retain_available true

# 持久化配置
persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db

# 自动清理过期 retain 消息（零保留时间 = 禁用清理）
# retain 消息默认永久保留，直到显式发布空 payload 清除
