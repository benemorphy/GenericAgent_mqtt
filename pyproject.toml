[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "beneh-ga"
version = "0.1.0"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: 慢速测试（集成测试）",
    "security: 安全相关测试",
]

[tool.coverage.run]
source = ["Mqtt_bbs_server", "Mqtt_bbs_client"]
omit = ["*/__pycache__/*", "*/tools/*", "*/test_*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "except ImportError",
    "if TYPE_CHECKING:",
]
